<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spesa Vocale</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
      background-color: #f8f9fa;
      color: #212529;
    }
    h1 {
      text-align: center;
      color: #1a73e8;
      font-size: 32px;
      margin-top: 10px;
      margin-bottom: 8px;
      font-weight: 800;
    }
    p.subtitle {
      text-align: center;
      font-size: 18px;
      color: #495057;
      margin-top: 0;
      margin-bottom: 24px;
      line-height: 1.4;
    }
    .voice-box {
      text-align: center;
      margin: 24px 0 32px 0;
    }
    .btn-mic {
      padding: 22px 36px;
      font-size: 24px;
      font-weight: bold;
      background: #28a745;
      color: white;
      border: none;
      border-radius: 60px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 6px 12px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 380px;
      transition: background-color 0.2s, transform 0.1s;
    }
    .btn-mic:active {
      transform: scale(0.98);
    }
    .btn-mic.listening {
      background: #dc3545;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.6; }
      100% { opacity: 1; }
    }
    .status {
      font-style: italic;
      color: #495057;
      min-height: 28px;
      margin-top: 14px;
      font-size: 18px;
      font-weight: 500;
    }
    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: white;
      border-radius: 12px;
      margin-bottom: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
      font-size: 22px;
    }
    .item-info {
      flex: 1;
      padding-right: 12px;
      word-break: break-word;
    }
    .item-price {
      color: #1a73e8;
      font-weight: 700;
    }
    .btn-del {
      background: #dc3545;
      color: white;
      border: none;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: bold;
      border-radius: 8px;
      cursor: pointer;
      min-width: 90px;
    }
    .total-box {
      margin-top: 30px;
      padding: 20px;
      background: #e8f0fe;
      border: 2px solid #b6d4fe;
      border-radius: 14px;
      text-align: right;
      font-size: 30px;
      font-weight: 800;
      color: #0c4128;
    }
  </style>
</head>
<body>

  <h1>Calcolatore Vocale</h1>
  <p class="subtitle">Premi il microfono e pronuncia:<br><strong>"Pane due euro e cinquanta"</strong></p>

  <div class="voice-box">
    <button id="micBtn" class="btn-mic" onclick="toggleAscolto()">🎤 Ascolta</button>
    <div id="status" class="status">Premi per parlare</div>
  </div>

  <ul id="lista"></ul>

  <div class="total-box">
    Totale: € <span id="totale">0.00</span>
  </div>

  <script>
    let articoli = [];
    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.classList.add('listening');
        btn.innerHTML = '🛑 In ascolto...';
        document.getElementById('status').textContent = 'Sto ascoltando...';
      };

      recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('micBtn');
        btn.classList.remove('listening');
        btn.innerHTML = '🎤 Ascolta';
        document.getElementById('status').textContent = 'Premi per parlare';
      };

      recognition.onresult = (event) => {
        const testo = event.results[0][0].transcript;
        elaboraVoce(testo);
      };

      recognition.onerror = (event) => {
        document.getElementById('status').textContent = 'Errore nel riconoscimento vocale.';
      };
    } else {
      document.getElementById('status').textContent = 'Riconoscimento vocale non supportato da questo browser.';
      document.getElementById('micBtn').disabled = true;
    }

    function toggleAscolto() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function elaboraVoce(testo) {
      document.getElementById('status').textContent = `Capito: "${testo}"`;
      
      let prezzo = null;
      let testoPulito = testo.toLowerCase().replace('virgola', '.').replace(',', '.');
      
      const match = testoPulito.match(/\d+(\.\d+)?/);
      
      if (match) {
        prezzo = parseFloat(match[0]);
      }

      if (prezzo !== null && !isNaN(prezzo) && prezzo > 0) {
        let nome = testo.replace(/\d+/g, '').replace(/euro/gi, '').replace(/virgola/gi, '').replace(/e/gi, '').trim();
        if (!nome) nome = 'Articolo';

        articoli.push({ nome: nome.charAt(0).toUpperCase() + nome.slice(1), prezzo });
        aggiornaLista();
      } else {
        alert('Non ho trovato un prezzo valido. Riprova pronunciando una cifra (es. "3 euro e 50").');
      }
    }

    function rimuoviArticolo(index) {
      articoli.splice(index, 1);
      aggiornaLista();
    }

    function aggiornaLista() {
      const listaEl = document.getElementById('lista');
      const totaleEl = document.getElementById('totale');
      
      listaEl.innerHTML = '';
      let totale = 0;

      articoli.forEach((item, index) => {
        totale += item.prezzo;
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="item-info">${item.nome}: <span class="item-price">€ ${item.prezzo.toFixed(2)}</span></div>
          <button class="btn-del" onclick="rimuoviArticolo(${index})">Rimuovi</button>
        `;
        listaEl.appendChild(li);
      });

      totaleEl.textContent = totale.toFixed(2);
    }
  </script>

</body>
</html>
