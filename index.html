<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no">
  <title>Spesa Vocale</title>
  <style>
    :root {
      --primary: #1a73e8;
      --primary-bg: #e8f0fe;
      --success: #28a745;
      --danger: #dc3545;
      --text: #1f2937;
      --text-muted: #6b7280;
      --bg: #f3f4f6;
      --card-bg: #ffffff;
      --radius: 16px;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      margin: 0;
      padding: env(safe-area-inset-top, 16px) env(safe-area-inset-right, 16px) env(safe-area-inset-bottom, 20px) env(safe-area-inset-left, 16px);
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      width: 100%;
      flex: 1;
      display: flex;
      flex-direction: column;
    }

    header {
      text-align: center;
      padding: 12px 0 8px 0;
    }

    h1 {
      font-size: clamp(26px, 6vw, 34px);
      color: var(--primary);
      margin: 0 0 6px 0;
      font-weight: 800;
      letter-spacing: -0.5px;
    }

    p.subtitle {
      font-size: clamp(15px, 4vw, 18px);
      color: var(--text-muted);
      margin: 0;
      line-height: 1.35;
    }

    .voice-box {
      text-align: center;
      margin: 16px 0 20px 0;
    }

    .btn-mic {
      width: 100%;
      min-height: 64px;
      padding: 16px 24px;
      font-size: clamp(20px, 5vw, 24px);
      font-weight: 700;
      background-color: var(--success);
      color: #ffffff;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 14px rgba(40, 167, 69, 0.35);
      transition: transform 0.15s ease, background-color 0.2s ease, box-shadow 0.2s ease;
    }

    .btn-mic:active {
      transform: scale(0.97);
    }

    .btn-mic.listening {
      background-color: var(--danger);
      box-shadow: 0 4px 14px rgba(220, 53, 69, 0.4);
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.98); }
      100% { opacity: 1; transform: scale(1); }
    }

    .status {
      font-size: clamp(15px, 3.8vw, 17px);
      color: var(--text-muted);
      min-height: 24px;
      margin-top: 10px;
      font-weight: 500;
      font-style: italic;
    }

    .list-container {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 16px;
    }

    ul {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 18px;
      background: var(--card-bg);
      border-radius: var(--radius);
      margin-bottom: 10px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
      border: 1px solid rgba(0, 0, 0, 0.03);
    }

    .item-info {
      flex: 1;
      padding-right: 12px;
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 600;
      word-break: break-word;
    }

    .item-price {
      color: var(--primary);
      font-weight: 800;
      white-space: nowrap;
    }

    .btn-del {
      background-color: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
      padding: 10px 16px;
      font-size: clamp(15px, 3.8vw, 17px);
      font-weight: 700;
      border-radius: 12px;
      cursor: pointer;
      min-width: 80px;
      transition: background-color 0.15s ease;
    }

    .btn-del:active {
      background-color: #fca5a5;
      color: #7f1d1d;
    }

    .total-box {
      position: sticky;
      bottom: 0;
      padding: 18px 20px;
      background: var(--primary-bg);
      border: 2px solid #bfdbfe;
      border-radius: var(--radius);
      text-align: right;
      font-size: clamp(24px, 6vw, 32px);
      font-weight: 800;
      color: #1e3a8a;
      box-shadow: 0 4px 12px rgba(26, 115, 232, 0.15);
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>Calcolatore Vocale</h1>
      <p class="subtitle">Premi e pronuncia ad es.:<br><strong>"Pane due euro e cinquanta"</strong></p>
    </header>

    <div class="voice-box">
      <button id="micBtn" class="btn-mic" onclick="toggleAscolto()">🎤 Ascolta</button>
      <div id="status" class="status">Premi per parlare</div>
    </div>

    <div class="list-container">
      <ul id="lista"></ul>
    </div>

    <div class="total-box">
      Totale: € <span id="totale">0.00</span>
    </div>
  </div>

  <script>
    let articoli = [];
    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.classList.add('listening');
        btn.innerHTML = '🛑 In ascolto...';
        document.getElementById('status').textContent = 'Sto ascoltando...';
      };

      recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('micBtn');
        btn.classList.remove('listening');
        btn.innerHTML = '🎤 Ascolta';
        document.getElementById('status').textContent = 'Premi per parlare';
      };

      recognition.onresult = (event) => {
        const testo = event.results[0][0].transcript;
        elaboraVoce(testo);
      };

      recognition.onerror = (event) => {
        document.getElementById('status').textContent = 'Errore nel riconoscimento vocale.';
      };
    } else {
      document.getElementById('status').textContent = 'Riconoscimento vocale non supportato da questo browser.';
      document.getElementById('micBtn').disabled = true;
    }

    function toggleAscolto() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function elaboraVoce(testo) {
      document.getElementById('status').textContent = `Capito: "${testo}"`;
      
      let prezzo = null;
      let testoPulito = testo.toLowerCase().replace('virgola', '.').replace(',', '.');
      
      const match = testoPulito.match(/\d+(\.\d+)?/);
      
      if (match) {
        prezzo = parseFloat(match[0]);
      }

      if (prezzo !== null && !isNaN(prezzo) && prezzo > 0) {
        let nome = testo.replace(/\d+/g, '').replace(/euro/gi, '').replace(/virgola/gi, '').replace(/e/gi, '').trim();
        if (!nome) nome = 'Articolo';

        articoli.push({ nome: nome.charAt(0).toUpperCase() + nome.slice(1), prezzo });
        aggiornaLista();
      } else {
        alert('Non ho trovato un prezzo valido. Riprova pronunciando una cifra (es. "3 euro e 50").');
      }
    }

    function rimuoviArticolo(index) {
      articoli.splice(index, 1);
      aggiornaLista();
    }

    function aggiornaLista() {
      const listaEl = document.getElementById('lista');
      const totaleEl = document.getElementById('totale');
      
      listaEl.innerHTML = '';
      let totale = 0;

      articoli.forEach((item, index) => {
        totale += item.prezzo;
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="item-info">${item.nome}: <span class="item-price">€ ${item.prezzo.toFixed(2)}</span></div>
          <button class="btn-del" onclick="rimuoviArticolo(${index})">Rimuovi</button>
        `;
        listaEl.appendChild(li);
      });

      totaleEl.textContent = totale.toFixed(2);
    }
  </script>

</body>
</html>
