<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Spesa Vocale</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: #eef7f2; /* Sfondo verde chiaro */
      color: #1a1a1a;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: env(safe-area-inset-top, 16px) 16px calc(120px + env(safe-area-inset-bottom, 16px)) 16px;
      max-width: 650px;
      margin: 0 auto;
    }
    header {
      text-align: center;
      padding: 12px 0 6px 0;
    }
    h1 {
      color: #1b5e20;
      font-size: clamp(30px, 8vw, 40px);
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    p.subtitle {
      font-size: clamp(18px, 5vw, 22px);
      color: #2e7d32;
      margin-top: 6px;
      line-height: 1.35;
    }
    .voice-box {
      text-align: center;
      margin: 16px 0 20px 0;
    }
    .btn-mic {
      width: 100%;
      min-height: clamp(70px, 11vh, 86px);
      font-size: clamp(24px, 6.5vw, 32px);
      font-weight: 800;
      background: #2e7d32;
      color: #ffffff;
      border: none;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 8px 16px rgba(46, 125, 50, 0.3);
      transition: all 0.2s ease;
    }
    .btn-mic:active {
      transform: scale(0.97);
    }
    .btn-mic.listening {
      background: #c62828;
      box-shadow: 0 8px 16px rgba(198, 40, 40, 0.3);
      animation: pulse 1.4s infinite;
    }
    @keyframes pulse {
      0% { opacity: 1; }
      50% { opacity: 0.65; }
      100% { opacity: 1; }
    }
    .status {
      font-style: italic;
      color: #2e7d32;
      min-height: 28px;
      margin-top: 10px;
      font-size: clamp(17px, 4.5vw, 20px);
      font-weight: 600;
    }
    .list-container {
      flex: 1;
      overflow-y: auto;
      margin-bottom: 10px;
    }
    ul {
      list-style: none;
    }
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 18px;
      background: #ffffff;
      border-radius: 16px;
      margin-bottom: 12px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.05);
      border: 1px solid #c8e6c9;
      font-size: clamp(22px, 5.8vw, 28px);
    }
    .item-info {
      flex: 1;
      padding-right: 12px;
      word-break: break-word;
      font-weight: 600;
    }
    .item-price {
      color: #1b5e20;
      font-weight: 800;
    }
    .btn-del {
      background: #ffebee;
      color: #c62828;
      border: 1px solid #ffcdd2;
      padding: 12px 18px;
      font-size: clamp(18px, 4.5vw, 22px);
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      min-width: 95px;
      transition: background 0.15s;
    }
    .btn-del:active {
      background: #c62828;
      color: #ffffff;
    }

    /* Total box flottante in basso integrato con la palette verde */
    .total-box-floating {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      max-width: 650px;
      margin: 0 auto;
      padding: 18px 20px calc(18px + env(safe-area-inset-bottom, 0px)) 20px;
      background: rgba(232, 245, 233, 0.98);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-top: 3px solid #a5d6a7;
      box-shadow: 0 -4px 20px rgba(0, 0, 0, 0.1);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: clamp(26px, 7vw, 34px);
      font-weight: 800;
      color: #1b5e20;
      z-index: 1000;
    }
    .total-amount {
      color: #2e7d32;
      font-size: clamp(32px, 8.5vw, 42px);
    }
  </style>
</head>
<body>

  <header>
    <h1>Calcolatore Vocale</h1>
    <p class="subtitle">Premi il microfono e pronuncia:<br><strong>"Pane 2 euro e 50"</strong></p>
  </header>

  <div class="voice-box">
    <button id="micBtn" class="btn-mic" onclick="toggleAscolto()">🎤 Ascolta</button>
    <div id="status" class="status">Premi per parlare</div>
  </div>

  <div class="list-container">
    <ul id="lista"></ul>
  </div>

  <div class="total-box-floating">
    <span>Totale</span>
    <span class="total-amount">€ <span id="totale">0.00</span></span>
  </div>

  <script>
    let articoli = [];
    let recognition = null;
    let isListening = false;

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'it-IT';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        isListening = true;
        const btn = document.getElementById('micBtn');
        btn.classList.add('listening');
        btn.innerHTML = '🛑 In ascolto...';
        document.getElementById('status').textContent = 'Sto ascoltando...';
      };

      recognition.onend = () => {
        isListening = false;
        const btn = document.getElementById('micBtn');
        btn.classList.remove('listening');
        btn.innerHTML = '🎤 Ascolta';
        document.getElementById('status').textContent = 'Premi per parlare';
      };

      recognition.onresult = (event) => {
        const testo = event.results[0][0].transcript;
        elaboraVoce(testo);
      };

      recognition.onerror = (event) => {
        document.getElementById('status').textContent = 'Errore nel riconoscimento vocale.';
      };
    } else {
      document.getElementById('status').textContent = 'Riconoscimento vocale non supportato da questo browser.';
      document.getElementById('micBtn').disabled = true;
    }

    function toggleAscolto() {
      if (!recognition) return;
      if (isListening) {
        recognition.stop();
      } else {
        recognition.start();
      }
    }

    function elaboraVoce(testo) {
      document.getElementById('status').textContent = `Capito: "${testo}"`;
      
      let prezzo = null;
      let testoPulito = testo.toLowerCase().replace('virgola', '.').replace(',', '.');
      
      const match = testoPulito.match(/\d+(\.\d+)?/);
      
      if (match) {
        prezzo = parseFloat(match[0]);
      }

      if (prezzo !== null && !isNaN(prezzo) && prezzo > 0) {
        let nome = testo.replace(/\d+/g, '').replace(/euro/gi, '').replace(/virgola/gi, '').replace(/e/gi, '').trim();
        if (!nome) nome = 'Articolo';

        articoli.push({ nome: nome.charAt(0).toUpperCase() + nome.slice(1), prezzo });
        aggiornaLista();
      } else {
        alert('Non ho trovato un prezzo valido. Riprova pronunciando una cifra (es. "3 euro e 50").');
      }
    }

    function rimuoviArticolo(index) {
      articoli.splice(index, 1);
      aggiornaLista();
    }

    function aggiornaLista() {
      const listaEl = document.getElementById('lista');
      const totaleEl = document.getElementById('totale');
      
      listaEl.innerHTML = '';
      let totale = 0;

      articoli.forEach((item, index) => {
        totale += item.prezzo;
        const li = document.createElement('li');
        li.innerHTML = `
          <div class="item-info">${item.nome}: <span class="item-price">€ ${item.prezzo.toFixed(2)}</span></div>
          <button class="btn-del" onclick="rimuoviArticolo(${index})">Elimina</button>
        `;
        listaEl.appendChild(li);
      });

      totaleEl.textContent = totale.toFixed(2);
    }
  </script>

</body>
</html>
